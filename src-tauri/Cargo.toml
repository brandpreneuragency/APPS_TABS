[package]
name = "tabs"
version = "1.1.3"
description = "TABS - Writing and task manager with AI assistance"
authors = ["TABS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tabs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
tasks-acceptance = []
clients-acceptance = ["dep:reqwest", "dep:url", "dep:getrandom", "windows-sys/Win32_UI_Shell", "windows-sys/Win32_UI_WindowsAndMessaging"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.8"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "=0.12.28", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = { version = "=2.5.8", optional = true }
getrandom = { version = "=0.2.17", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
